name: Pipeline CI/CD Demo

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  integracion-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Verificar que exista index.html
        run: test -f index.html && echo "Prueba exitosa: index.html encontrado"

  despliegue-cd:
    needs: integracion-ci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar artefacto web
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Desplegar en producción
        id: deployment
        uses: actions/deploy-pages@v4
